<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0078D4;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#FF9900;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00C7B7;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#00C7B7;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowText">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C7B7">
        <animate attributeName="stop-color" values="#00C7B7;#ffffff;#FF9900;#ffffff;#00C7B7" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#FF9900">
        <animate attributeName="stop-color" values="#FF9900;#00C7B7;#ffffff;#FF9900" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:0"/>
      <stop offset="25%" style="stop-color:#0078D4"/>
      <stop offset="50%" style="stop-color:#00C7B7"/>
      <stop offset="75%" style="stop-color:#FF9900"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00C7B7;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00C7B7;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#00C7B7;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="900" height="300" fill="url(#bgGrad)"/>

  <!-- Scan line animada -->
  <rect width="900" height="60" fill="url(#scanGrad)">
    <animateTransform attributeName="transform" type="translate" values="0,-60;0,360" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Orbe izquierdo pulsante -->
  <ellipse cx="130" cy="150" rx="220" ry="200" fill="url(#orb1)">
    <animate attributeName="rx" values="220;270;220;180;220" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="200;240;200;160;200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.6;1;0.8" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orbe derecho pulsante -->
  <ellipse cx="770" cy="150" rx="220" ry="200" fill="url(#orb2)">
    <animate attributeName="rx" values="220;180;260;220" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="200;160;240;200" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.5;1;0.8" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orbe centro -->
  <ellipse cx="450" cy="150" rx="280" ry="160" fill="url(#orb3)">
    <animate attributeName="rx" values="280;320;280;240;280" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.5;1;0.7" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Grid tech -->
  <g opacity="0.08" stroke="#00C7B7" stroke-width="0.5">
    <line x1="0" y1="60" x2="900" y2="60" stroke-dasharray="3,45"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke-dasharray="3,45"/>
    <line x1="0" y1="180" x2="900" y2="180" stroke-dasharray="3,45"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke-dasharray="3,45"/>
    <line x1="150" y1="0" x2="150" y2="300" stroke-dasharray="3,45"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke-dasharray="3,45"/>
    <line x1="450" y1="0" x2="450" y2="300" stroke-dasharray="3,45"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke-dasharray="3,45"/>
    <line x1="750" y1="0" x2="750" y2="300" stroke-dasharray="3,45"/>
  </g>

  <!-- Estrellas parpadeantes -->
  <g fill="white">
    <circle cx="40"  cy="18"  r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="50"  r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="25"  r="1.0"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="12"  r="1.3"><animate attributeName="opacity" values="1;0.1;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="38"  r="1.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="20"  r="1.0"><animate attributeName="opacity" values="1;0.3;1" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="45"  r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="15"  r="1.1"><animate attributeName="opacity" values="1;0.4;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="35"  r="1.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="22"  r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="55"  r="1.0"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="55"  cy="260" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="275" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="268" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="280" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="265" r="1.5"><animate attributeName="opacity" values="1;0.4;1" dur="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="272" r="1.2"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Partículas orbitando - azul -->
  <g filter="url(#glow1)">
    <circle r="4" fill="#0078D4">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 80 80 Q 200 40 320 80 Q 440 120 560 80 Q 680 40 800 80"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#00C7B7">
      <animateMotion dur="10s" repeatCount="indefinite" begin="2s" path="M 800 220 Q 650 260 500 220 Q 350 180 200 220 Q 100 240 50 220"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="10s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle r="3.5" fill="#FF9900">
      <animateMotion dur="12s" repeatCount="indefinite" begin="4s" path="M 100 200 Q 250 160 400 200 Q 550 240 700 200 Q 820 170 880 200"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="12s" repeatCount="indefinite" begin="4s"/>
    </circle>
  </g>

  <!-- Partículas flotantes verticales -->
  <g filter="url(#glow2)">
    <circle cx="75"  cy="120" r="4" fill="#0078D4">
      <animate attributeName="cy" values="120;90;120" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="825" cy="170" r="3.5" fill="#FF9900">
      <animate attributeName="cy" values="170;140;170" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="230" r="3" fill="#00C7B7">
      <animate attributeName="cy" values="230;205;230" dur="3.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="65"  r="3.5" fill="#00C7B7">
      <animate attributeName="cy" values="65;40;65" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="260" r="4" fill="#0078D4">
      <animate attributeName="cy" values="260;235;260" dur="5.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5.0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Línea superior animada -->
  <rect x="0" y="2" width="900" height="2.5" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Línea inferior animada -->
  <rect x="0" y="295" width="900" height="2.5" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Línea central separadora -->
  <rect x="100" y="188" width="700" height="1" fill="url(#lineGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- NOMBRE PRINCIPAL -->
  <text x="450" y="118"
    font-family="'Segoe UI', 'Arial Black', Arial, sans-serif"
    font-size="52"
    font-weight="800"
    text-anchor="middle"
    fill="url(#nameGrad)"
    filter="url(#glowText)"
    letter-spacing="1">
    José Ramones Moreno
  </text>

  <!-- ROL -->
  <text x="450" y="160"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="16"
    font-weight="500"
    text-anchor="middle"
    fill="#00C7B7"
    letter-spacing="5">
    ☁  CLOUD SOLUTIONS ARCHITECT
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- BADGES TECH -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    <rect x="192" y="196" width="68" height="21" rx="10.5" fill="#FF9900" fill-opacity="0.12" stroke="#FF9900" stroke-width="1" stroke-opacity="0.9"/>
    <text x="226" y="211" fill="#FF9900">⬡ AWS</text>

    <rect x="273" y="196" width="98" height="21" rx="10.5" fill="#4285F4" fill-opacity="0.12" stroke="#4285F4" stroke-width="1" stroke-opacity="0.9"/>
    <text x="322" y="211" fill="#6aabff">☁ Google Cloud</text>

    <rect x="384" y="196" width="72" height="21" rx="10.5" fill="#0066CC" fill-opacity="0.12" stroke="#6699FF" stroke-width="1" stroke-opacity="0.9"/>
    <text x="420" y="211" fill="#6699FF">🛡 Sophos</text>

    <rect x="469" y="196" width="68" height="21" rx="10.5" fill="#2496ED" fill-opacity="0.12" stroke="#2496ED" stroke-width="1" stroke-opacity="0.9"/>
    <text x="503" y="211" fill="#2496ED">🐳 Docker</text>

    <rect x="550" y="196" width="82" height="21" rx="10.5" fill="#7B42BC" fill-opacity="0.12" stroke="#9B62DC" stroke-width="1" stroke-opacity="0.9"/>
    <text x="591" y="211" fill="#9B62DC">⬡ Terraform</text>

    <rect x="645" y="196" width="88" height="21" rx="10.5" fill="#326CE5" fill-opacity="0.12" stroke="#326CE5" stroke-width="1" stroke-opacity="0.9"/>
    <text x="689" y="211" fill="#5a8fff">⎈ Kubernetes</text>
  </g>

  <!-- FOOTER TEXT -->
  <text x="450" y="265"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="11"
    text-anchor="middle"
    fill="#8b949e"
    letter-spacing="5">
    AWS CERTIFIED  ·  SOPHOS ARCHITECT  ·  GOOGLE CLOUD  ·  DELL DCSE
  </text>

</svg>
